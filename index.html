<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QPAC Material Readiness Control</title>
<style>
:root{--nav:#17324d;--blue:#2f6fad;--bg:#f3f6f9;--line:#d7e0e8;--green:#63be7b;--yellow:#ffd966;--red:#f8696b;--gray:#e8edf1;--purple:#d9ccff}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#18232d}
header{background:var(--nav);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{margin:0;font-size:21px}header span{font-size:13px;opacity:.85}
.mainnav{background:#fff;border-bottom:1px solid var(--line);padding:0 20px;display:flex;flex-wrap:wrap}.mainnav button{border:0;background:#fff;padding:14px 16px;cursor:pointer;font-weight:600;border-bottom:3px solid transparent}.mainnav button.active{color:var(--blue);border-bottom-color:var(--blue)}
main{max-width:1750px;margin:auto;padding:18px}.page{display:none}.page.active{display:block}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px;overflow:auto}
.modtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.modtabs button{border:1px solid #b8c6d2;background:#fff;padding:9px 17px;border-radius:5px;cursor:pointer;font-weight:700}.modtabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.right{margin-left:auto}button{font-family:inherit}.primary,.secondary,.success,.warning{padding:8px 12px;border-radius:5px;cursor:pointer;font-weight:600}.primary{background:var(--blue);color:#fff;border:0}.secondary{background:#fff;color:#18232d;border:1px solid #aebdca}.success{background:#3f8f55;color:#fff;border:0}.warning{background:#efb82f;color:#111;border:0}button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{border:1px solid #b9c6d2;border-radius:4px;padding:7px;font-family:inherit}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th{background:#eaf1f6;padding:9px;text-align:left;border-bottom:1px solid #ccd8e2}td{padding:9px;border-bottom:1px solid #e1e7ec;vertical-align:middle}.wrap{white-space:normal}.status{display:inline-block;padding:4px 9px;border-radius:13px;font-weight:700;font-size:12px}.green{background:var(--green)}.yellow{background:var(--yellow)}.red{background:var(--red)}.gray{background:#dce5ec}.purple{background:var(--purple)}.blue{background:#cfe3f6}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:15px}.card b{display:block;font-size:27px;margin-top:6px}.small{font-size:12px;color:#647585}.note{background:#eef6ff;border-left:4px solid var(--blue);padding:10px;margin:10px 0}.alert{background:#fff3c7;border-left:4px solid #e0ad20;padding:10px;margin:10px 0}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center}.modal.open{display:flex}.modalbox{width:97%;max-width:1500px;max-height:95vh;overflow:auto;background:#fff;border-radius:9px;padding:20px}
.detailHeader{background:#eef5fa;border-left:5px solid var(--blue);padding:14px;margin-bottom:15px}.process{display:flex;gap:7px;align-items:stretch;margin:15px 0;flex-wrap:wrap}.stage{flex:1;min-width:170px;border:2px solid #bdcad5;padding:12px;border-radius:7px;text-align:center}.stage.done{background:#dff1e4;border-color:#63be7b}.stage.progress{background:#fff3c7;border-color:#e2b93b}.stage.pending{background:#eef2f5}.arrow{align-self:center;font-size:21px}.sectionTitle{margin-top:25px;border-bottom:2px solid #d8e3eb;padding-bottom:7px}
.palletCard{border:1px solid var(--line);border-radius:7px;margin:12px 0;overflow:hidden}.palletHead{background:#eaf1f6;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.palletBody{padding:12px}.lineComplete{background:#e7f5e9!important}.linePartial{background:#fff6d8!important}.lineShort{background:#fde2e2!important}.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photos img{width:115px;height:82px;object-fit:cover;border:1px solid #ccd8e2;border-radius:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid label{font-size:12px;font-weight:600}.grid input,.grid textarea{width:100%;margin-top:4px}
@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.arrow{display:none}}
</style>
</head><body>
<header><h1>QPAC Material Readiness Control</h1><span>Operation-Based Pallet Workflow • SYSPRO Integration Demonstration</span></header>
<div class="mainnav" id="mainnav"></div>
<main>
<section id="plan" class="page active"><div class="modtabs" id="modtabs"></div><div class="cards">
<div class="card">Displayed Subunits<b id="kUnits">0</b></div><div class="card">Active Pallets<b id="kPallets">0</b></div><div class="card">T-3 Delivered<b id="kDelivered">0</b></div><div class="card">Open Shortages<b id="kShort">0</b></div><div class="card">T-1 Risk<b id="kRisk">0</b></div></div>
<div class="panel"><div class="toolbar"><strong id="workspaceTitle">ALL MODs</strong><span class="small" id="workspaceDesc"></span><div class="right">Search <input id="search" placeholder="Subunit / pallet" oninput="renderPlan()"></div></div><div id="planTable"></div></div></section>
<section id="kitting" class="page"><div id="kitPage"></div></section>
<section id="qc" class="page"><div id="qcPage"></div></section>
<section id="delivery" class="page"><div id="deliveryPage"></div></section>
<section id="pc" class="page"><div id="pcPage"></div></section>
<section id="schedule" class="page"><div id="schedulePage"></div></section>
<section id="shortages" class="page"><div id="shortagePage"></div></section>
<section id="process" class="page"><div id="processPage"></div></section>
</main>
<div class="modal" id="detailModal"><div class="modalbox"><div id="detailContent"></div></div></div>
<script>
const MODS=["A","B","C","D2","D2B","E"], KEY="qpacPalletWorkflowV4";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>v?new Date(v).toLocaleString([], {year:"numeric",month:"2-digit",day:"2-digit",hour:"numeric",minute:"2-digit"}):"";
function at6pmBefore(start,days){let d=new Date(start);d.setDate(d.getDate()-days);d.setHours(18,0,0,0);return d}
function deadlines(u){let t0=new Date(u.productionStart),t3=at6pmBefore(u.productionStart,3),t2=at6pmBefore(u.productionStart,2),t1=at6pmBefore(u.productionStart,1);return {t0,t3,t2,t1,kit72:new Date(t3.getTime()-72*3600000),kit48:new Date(t3.getTime()-48*3600000)}}
function mkParts(prefix){return[
{id:uid(),part:prefix+"-1001",desc:"Support Bracket",required:50,kitted:40,qcVerified:0,pcVerified:0},
{id:uid(),part:prefix+"-1002",desc:"Mounting Plate",required:20,kitted:20,qcVerified:0,pcVerified:0},
{id:uid(),part:prefix+"-1003",desc:"Fastener Kit",required:12,kitted:12,qcVerified:0,pcVerified:0}]}
function seed(){
 let base=new Date();base.setDate(base.getDate()+7);base.setHours(7,0,0,0);
 let units=[]; MODS.forEach((m,mi)=>{for(let j=1;j<=2;j++){let ps=new Date(base.getTime()+(mi*2+j-1)*86400000);let sub="P"+(40+mi*2+j);
 let u={id:uid(),priority:j,mod:m,subunit:sub,productionStart:ps.toISOString(),comments:"",pallets:[]};
 if(j===1){u.pallets=[
 {id:uid(),pallet:`PAL-${m}-${sub}-001`,bin:`BIN-${m}-${sub}-001`,operations:"1–3",sysproStatus:"IN PROGRESS",parts:mkParts(m+"13"),kitPhotos:[],releasedQC:false,qcPhotos:[],qcReady:false,deliveryPhotos:[],delivered:false,deliveryTime:"",dropLocation:"",pcPhotos:[],pcComplete:false,pcTime:""},
 {id:uid(),pallet:`PAL-${m}-${sub}-002`,bin:`BIN-${m}-${sub}-002`,operations:"4–5",sysproStatus:"STARTED",parts:mkParts(m+"45").map((x,i)=>({...x,kitted:i?x.required:10})),kitPhotos:[],releasedQC:false,qcPhotos:[],qcReady:false,deliveryPhotos:[],delivered:false,deliveryTime:"",dropLocation:"",pcPhotos:[],pcComplete:false,pcTime:""}]}
 units.push(u)}});return {units}}
let db=JSON.parse(localStorage.getItem(KEY)||"null")||seed(), selectedMod="ALL", page="plan", detailId=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function allPallets(){return db.units.flatMap(u=>u.pallets.map(p=>({u,p})))}
function shortage(part,field){let base=field==="pcVerified"?(part.qcVerified||part.kitted):field==="qcVerified"?part.kitted:part.required;return Math.max(0,Number(base)-Number(part[field]||0))}
function kitShort(part){return Math.max(0,Number(part.required)-Number(part.kitted||0))}
function stage(p){if(p.pcComplete)return"PC VERIFIED";if(p.delivered)return"DELIVERED";if(p.qcReady)return"READY FOR DELIVERY";if(p.releasedQC)return"WAREHOUSE QC";return"KITTING"}
function badge(p){let s=stage(p),c=s==="PC VERIFIED"?"green":s==="KITTING"?"gray":s==="WAREHOUSE QC"?"yellow":"purple";return `<span class="status ${c}">${s}</span>`}
function showPage(id){page=id;document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.id===id));renderAll()}
function buildNav(){let n=[["plan","Kitting Plan"],["kitting","Kitting Warehouse"],["qc","Warehouse QC"],["delivery","Deliver to Production"],["pc","Production Control"],["schedule","T-3 / T-2 / T-1"],["shortages","Central Shortage Report"],["process","Process Map"]];document.getElementById("mainnav").innerHTML=n.map(x=>`<button class="${page===x[0]?"active":""}" onclick="showPage('${x[0]}')">${x[1]}</button>`).join("")}
function buildMods(){document.getElementById("modtabs").innerHTML=["ALL",...MODS].map(m=>`<button class="${selectedMod===m?"active":""}" onclick="selectedMod='${m}';renderPlan()">${m==="ALL"?"ALL":"MOD "+m}</button>`).join("")}
function visibleUnits(){let now=new Date(),a=db.units.filter(u=>selectedMod==="ALL"||u.mod===selectedMod);if(selectedMod==="ALL")return a.filter(u=>new Date(u.productionStart)>=now).sort((a,b)=>new Date(a.productionStart)-new Date(b.productionStart)).slice(0,10);let prev=a.filter(u=>new Date(u.productionStart)<now).sort((a,b)=>new Date(b.productionStart)-new Date(a.productionStart)),up=a.filter(u=>new Date(u.productionStart)>=now).sort((a,b)=>new Date(a.productionStart)-new Date(b.productionStart)).slice(0,10);return [...prev,...up]}
function unitShorts(u){return u.pallets.reduce((n,p)=>n+p.parts.filter(x=>kitShort(x)>0).length,0)}
function unitDelivered(u){return u.pallets.length>0&&u.pallets.every(p=>p.delivered)}
function unitPC(u){return u.pallets.length>0&&u.pallets.every(p=>p.pcComplete)}
function unitStatus(u){let d=deadlines(u),sh=unitShorts(u);if(sh&&new Date()>d.t1)return["T-1 SHORTAGE RISK","red"];if(unitPC(u)&&sh)return["T-1 RECOVERY","yellow"];if(unitPC(u))return["PC VERIFIED","green"];if(unitDelivered(u))return["T-3 DELIVERED / PC DUE","purple"];if(u.pallets.some(p=>p.qcReady))return["READY FOR T-3 DELIVERY","yellow"];if(u.pallets.some(p=>p.releasedQC))return["WAREHOUSE QC","yellow"];return["KITTING","gray"]}
function renderPlan(){buildMods();let q=(document.getElementById("search")?.value||"").toLowerCase(),units=visibleUnits().filter(u=>!q||u.subunit.toLowerCase().includes(q)||u.pallets.some(p=>p.pallet.toLowerCase().includes(q)));document.getElementById("workspaceTitle").textContent=selectedMod==="ALL"?"ALL MODs":"MOD "+selectedMod;document.getElementById("workspaceDesc").textContent=selectedMod==="ALL"?"Next 10 upcoming subunits":"Previous units + next 10 upcoming units";
 let rows=units.map(u=>{let d=deadlines(u),s=unitStatus(u),kit=u.pallets.reduce((a,p)=>a+p.parts.reduce((n,x)=>n+x.kitted,0),0),req=u.pallets.reduce((a,p)=>a+p.parts.reduce((n,x)=>n+x.required,0),0);return `<tr><td>${u.priority}</td><td>${u.mod}</td><td><b>${u.subunit}</b></td><td>${u.pallets.length}</td><td>${fmt(u.productionStart)}</td><td>${fmt(d.t3)}</td><td>${fmt(d.t2)}</td><td>${fmt(d.t1)}</td><td>${kit}/${req}</td><td>${unitShorts(u)}</td><td><span class="status ${s[1]}">${s[0]}</span></td><td><button class="primary" onclick="openDetail('${u.id}')">Open Details</button></td></tr>`}).join("");
 document.getElementById("planTable").innerHTML=`<table><thead><tr><th>Priority</th><th>MOD</th><th>Subunit</th><th>Pallets from SYSPRO</th><th>Production Start</th><th>T-3 Delivery</th><th>T-2 PC Verification</th><th>T-1 Recovery</th><th>Kitted Qty</th><th>Open Short Lines</th><th>Current Stage</th><th>Action</th></tr></thead><tbody>${rows||"<tr><td colspan=12>No units.</td></tr>"}</tbody></table>`;
 document.getElementById("kUnits").textContent=units.length;document.getElementById("kPallets").textContent=units.reduce((n,u)=>n+u.pallets.length,0);document.getElementById("kDelivered").textContent=units.filter(unitDelivered).length;document.getElementById("kShort").textContent=units.reduce((n,u)=>n+unitShorts(u),0);document.getElementById("kRisk").textContent=units.filter(u=>unitShorts(u)&&new Date()>deadlines(u).t1).length}
function filterStage(kind){return allPallets().filter(({p})=>kind==="kitting"||kind==="qc"&&p.releasedQC||kind==="delivery"&&p.qcReady||kind==="pc"&&p.delivered)}
function stagePage(kind){let titles={kitting:"Kitting Warehouse",qc:"Warehouse QC",delivery:"Deliver to Production Line",pc:"Production Control Verification"},arr=filterStage(kind);return `<div class="panel"><div class="toolbar"><h2 style="margin:0">${titles[kind]}</h2>${kind==="kitting"?'<div class="right"><button class="primary" onclick="demoNewPallet()">Demo: Read New Pallet from SYSPRO</button></div>':""}</div>${kind==="kitting"?'<div class="note">Pallet number, bin, operation assignment, required quantity and picker-posted Kitted Qty are read from SYSPRO. The warehouse does not create the pallet in this application.</div>':""}<table><thead><tr><th>MOD</th><th>Subunit</th><th>Pallet / Bin</th><th>Operations</th><th>Stage</th><th>Short Lines</th><th>Action</th></tr></thead><tbody>${arr.map(({u,p})=>`<tr><td>${u.mod}</td><td>${u.subunit}</td><td><b>${p.pallet}</b><br><span class="small">${p.bin}</span></td><td>OP ${p.operations}</td><td>${badge(p)}</td><td>${p.parts.filter(x=>kind==="pc"?shortage(x,"pcVerified")>0:kind==="qc"?shortage(x,"qcVerified")>0:kitShort(x)>0).length}</td><td><button class="primary" onclick="openPallet('${p.id}','${kind}')">Open Pallet</button></td></tr>`).join("")||"<tr><td colspan=7>No pallets available.</td></tr>"}</tbody></table></div>`}
function renderStagePages(){document.getElementById("kitPage").innerHTML=stagePage("kitting");document.getElementById("qcPage").innerHTML=stagePage("qc");document.getElementById("deliveryPage").innerHTML=stagePage("delivery");document.getElementById("pcPage").innerHTML=stagePage("pc")}
function flow(u,active="overview"){let p=u.pallets,st=[["Kitting / SYSPRO","kitting",p.length&&p.every(x=>x.releasedQC)],["Warehouse QC","qc",p.length&&p.every(x=>x.qcReady)],["T-3 Delivery","delivery",unitDelivered(u)],["T-2 PC Verification","pc",unitPC(u)],["T-1 Recovery","recovery",unitPC(u)&&unitShorts(u)===0]];return `<div class="process">${st.map((x,i)=>`<div class="stage ${active===x[1]?"progress":x[2]?"done":"pending"}" style="cursor:pointer" onclick="renderDetailStage('${u.id}','${x[1]}')"><b>${x[0]}</b><p>${active===x[1]?"CURRENT VIEW":x[2]?"Complete":"Open Stage"}</p></div>${i<st.length-1?'<div class="arrow">→</div>':""}`).join("")}</div><div class="small">Click a stage above. The MOD / subunit window stays open and changes to that stage.</div>`}
function openDetail(id){let u=db.units.find(x=>x.id===id);detailId=id;let d=deadlines(u);document.getElementById("detailContent").innerHTML=`<div class="toolbar"><div><h2 style="margin:0">MOD ${u.mod} — ${u.subunit}</h2><span class="small">Production Start: ${fmt(u.productionStart)}</span></div><div class="right"><button class="secondary" onclick="closeDetail()">Close</button></div></div><div class="detailHeader"><b>Kitting Window:</b> ${fmt(d.kit72)} to ${fmt(d.kit48)} &nbsp; <b>T-3:</b> ${fmt(d.t3)} &nbsp; <b>T-2:</b> ${fmt(d.t2)} &nbsp; <b>T-1:</b> ${fmt(d.t1)} &nbsp; <b>T-0:</b> ${fmt(d.t0)}</div>${flow(u,"overview")}<h3 class="sectionTitle">SYSPRO Pallets / Operation Pick Lists</h3>${u.pallets.map(p=>palletSummary(u,p)).join("")||'<div class="note">No pallet records received from SYSPRO yet.</div>'}<h3 class="sectionTitle">Production Information</h3><div class="grid"><label>Priority<input value="${esc(u.priority)}" onchange="updateUnit('${u.id}','priority',this.value)"></label><label>Production Start<input type="datetime-local" value="${u.productionStart.slice(0,16)}" onchange="updateUnit('${u.id}','productionStart',this.value)"></label><label>Comments<textarea onchange="updateUnit('${u.id}','comments',this.value)">${esc(u.comments)}</textarea></label></div>`;document.getElementById("detailModal").classList.add("open")}
function closeDetail(){document.getElementById("detailModal").classList.remove("open");detailId=null}
function palletSummary(u,p){
 let handoff=p.releasedQC?`<span class="status green">AVAILABLE IN WAREHOUSE QC</span>`:`<span class="status gray">NOT YET RELEASED TO QC</span>`;
 return `<div class="palletCard"><div class="palletHead"><div><b>${p.pallet}</b> • ${p.bin} • Operations ${p.operations}</div>${badge(p)}</div><div class="palletBody">
 ${partsTable(p,"KIT")}
 <h4>Kitting Completion / Handoff to Warehouse QC</h4>
 <div class="toolbar"><label><b>Upload kitted pallet photo(s)</b> <input type="file" accept="image/*" multiple onchange="addPhotos('${p.id}','kitPhotos',this,'detail')"></label>${handoff}</div>
 ${photoHTML(p.kitPhotos)}
 <br><button class="success" ${p.kitPhotos.length?"":"disabled"} onclick="releaseQC('${p.id}','detail')">${p.releasedQC?"DELIVERED TO WAREHOUSE QC ✓":"Submit / Deliver to Warehouse QC"}</button>
 ${p.releasedQC?`<button class="primary" onclick="renderDetailStage('${u.id}','qc')">Open Warehouse QC →</button>`:""}
 </div></div>`}
function renderDetailStage(unitId,kind){
 detailId=unitId;
 let u=db.units.find(x=>x.id===unitId); if(!u)return;
 let d=deadlines(u);
 let title={kitting:"Kitting / SYSPRO",qc:"Warehouse QC",delivery:"T-3 Delivery",pc:"T-2 Production Control Verification",recovery:"T-1 Recovery"}[kind];
 let pallets=kind==="kitting"?u.pallets:kind==="qc"?u.pallets.filter(p=>p.releasedQC):kind==="delivery"?u.pallets.filter(p=>p.qcReady):kind==="pc"?u.pallets.filter(p=>p.delivered):u.pallets.filter(p=>p.pcComplete);
 let cards=pallets.map(p=>`<div class="palletCard"><div class="palletHead"><div><b>${p.pallet}</b> • ${p.bin} • Operations ${p.operations}</div>${badge(p)}</div><div class="palletBody">${kind==="kitting"?kitBody(p):kind==="qc"?qcBody(p):kind==="delivery"?deliveryBody(p):kind==="pc"?pcBody(p):recoveryBody(p)}</div></div>`).join("");
 document.getElementById("detailContent").innerHTML=`<div class="toolbar"><div><h2 style="margin:0">MOD ${u.mod} — ${u.subunit}</h2><span class="small">Production Start: ${fmt(u.productionStart)}</span></div><div class="right"><button class="secondary" onclick="closeDetail()">Close</button></div></div><div class="detailHeader"><b>Kitting Window:</b> ${fmt(d.kit72)} to ${fmt(d.kit48)} &nbsp; <b>T-3:</b> ${fmt(d.t3)} &nbsp; <b>T-2:</b> ${fmt(d.t2)} &nbsp; <b>T-1:</b> ${fmt(d.t1)} &nbsp; <b>T-0:</b> ${fmt(d.t0)}</div>${flow(u,kind)}<h3 class="sectionTitle">${title}</h3>${cards||`<div class="note">No pallets are available at this stage yet. Complete the previous handoff first.</div>`}`;
 document.getElementById("detailModal").classList.add("open");
}
function recoveryBody(p){
 let rows=p.parts.filter(x=>kitShort(x)>0||shortage(x,"qcVerified")>0||shortage(x,"pcVerified")>0);
 return `<div class="note"><b>T-1 Recovery / Backpull:</b> All remaining shortages for this pallet are listed here for recovery before production start.</div>${rows.length?`<table><thead><tr><th>Part</th><th>Description</th><th>Kitting Short</th><th>QC Discrepancy</th><th>PC Discrepancy</th></tr></thead><tbody>${rows.map(x=>`<tr class="lineShort"><td><b>${x.part}</b></td><td>${x.desc}</td><td>${kitShort(x)}</td><td>${shortage(x,"qcVerified")}</td><td>${shortage(x,"pcVerified")}</td></tr>`).join("")}</tbody></table>`:`<span class="status green">NO OPEN SHORTAGES</span>`}`;
}
function openPallet(pid,kind){let z=allPallets().find(x=>x.p.id===pid);let u=z.u,p=z.p,d=deadlines(u),body=kind==="kitting"?kitBody(p):kind==="qc"?qcBody(p):kind==="delivery"?deliveryBody(p):pcBody(p);document.getElementById("detailContent").innerHTML=`<div class="toolbar"><div><h2 style="margin:0">${p.pallet}</h2><span class="small">MOD ${u.mod} / ${u.subunit} • ${p.bin} • Operations ${p.operations}</span></div><div class="right">${badge(p)} <button class="secondary" onclick="closeDetail()">Close</button></div></div><div class="detailHeader"><b>T-3 Delivery:</b> ${fmt(d.t3)} &nbsp; <b>T-2 PC Verification:</b> ${fmt(d.t2)} &nbsp; <b>T-1 Recovery:</b> ${fmt(d.t1)} &nbsp; <b>T-0:</b> ${fmt(d.t0)}</div>${body}`;document.getElementById("detailModal").classList.add("open")}
function partsTable(p,kind){return `<table><thead><tr><th>Status</th><th>Part Number</th><th>Description</th><th>Required Qty</th><th>Kitted Qty</th>${kind!=="KIT"?`<th>${kind==="QC"?"QC Verified":"PC Verified"} Qty</th>`:""}<th>Shortage Qty</th></tr></thead><tbody>${p.parts.map(x=>{let sh=kind==="KIT"?kitShort(x):shortage(x,kind==="QC"?"qcVerified":"pcVerified"),ver=kind==="QC"?x.qcVerified:x.pcVerified;return `<tr class="${sh>0?"lineShort":kind!=="KIT"&&ver?"lineComplete":""}"><td><span class="status ${sh?"red":"green"}">${sh?"SHORT":"OK"}</span></td><td><b>${x.part}</b></td><td>${x.desc}</td><td>${x.required}</td><td>${x.kitted}</td>${kind!=="KIT"?`<td>${ver||0}</td>`:""}<td><b>${sh}</b></td></tr>`}).join("")}</tbody></table>`}
function photoHTML(a){return a.length?`<div class="photos">${a.map(x=>`<div><img src="${x.data}"><div class="small">${esc(x.name)}</div></div>`).join("")}</div>`:'<div class="small">No photos uploaded.</div>'}
function kitBody(p){return `<div class="note"><b>Warehouse Kitting:</b> Picker works operation-wise in SYSPRO/Right Scan. Each posted transaction updates Kitted Qty here. Short quantities remain visible in red. When this pallet is finished, upload a pallet photo and release it to Warehouse QC.</div>${partsTable(p,"KIT")}<br><div class="toolbar"><button class="warning" onclick="simulatePick('${p.id}')">Demo: Simulate SYSPRO Pick Transaction</button><label><b>Kitted Pallet Photo(s)</b> <input type="file" accept="image/*" multiple onchange="addPhotos('${p.id}','kitPhotos',this)"></label></div>${photoHTML(p.kitPhotos)}<br><button class="success" ${p.kitPhotos.length?"":"disabled"} onclick="releaseQC('${p.id}')">${p.releasedQC?"DELIVERED TO WAREHOUSE QC ✓":"Upload Photo + Deliver to Warehouse QC"}</button>`}
function qcBody(p){return `<div class="note"><b>Warehouse QC:</b> This pallet became available immediately when Kitting submitted it. The kitted-pallet photo from Warehouse is shown below. Scan each part barcode and verify quantity.</div><h3>Kitting Handoff Photo</h3>${photoHTML(p.kitPhotos)}<h3>QC Part Verification</h3>${partsTable(p,"QC")}<br><div class="toolbar"><button class="primary" onclick="verifyAll('${p.id}','qcVerified')">Demo: Scan / Verify All</button><button class="warning" onclick="makeShort('${p.id}','qcVerified')">Demo: Create Discrepancy</button><label><b>QC completion photo(s)</b> <input type="file" accept="image/*" multiple onchange="addPhotos('${p.id}','qcPhotos',this)"></label></div>${photoHTML(p.qcPhotos)}<br><button class="success" onclick="readyDelivery('${p.id}')">${p.qcReady?"READY FOR DELIVERY ✓":"Submit QC / Ready for Delivery"}</button>${p.qcReady?` <button class="primary" onclick="openNextInModal('${p.id}','delivery')">Open Delivery Stage →</button>`:""}` }
function deliveryBody(p){return `<div class="note"><b>Physical Delivery:</b> This pallet is available because Warehouse QC released it. QC evidence remains visible through the handoff chain.</div><h3>Kitting Photo</h3>${photoHTML(p.kitPhotos)}<h3>Warehouse QC Photo</h3>${photoHTML(p.qcPhotos)}<h3>Production Delivery</h3><div class="grid"><label>Drop Location<input id="drop" value="${esc(p.dropLocation)}" placeholder="Example: MOD A / Station 3"></label><label><b>Delivery / drop-point photo(s)</b><input type="file" accept="image/*" multiple onchange="addPhotos('${p.id}','deliveryPhotos',this)"></label></div>${photoHTML(p.deliveryPhotos)}<br><button class="success" ${p.deliveryPhotos.length?"":"disabled"} onclick="confirmDelivery('${p.id}')">${p.delivered?"DELIVERED TO PRODUCTION ✓":"Confirm Delivered to Production Line"}</button>${p.delivered?` <button class="primary" onclick="openNextInModal('${p.id}','pc')">Open Production Control →</button><div class="small">Delivered ${fmt(p.deliveryTime)} • ${esc(p.dropLocation)}</div>`:""}`}
function pcBody(p){return `<div class="note"><b>Production Control:</b> Pallet was dropped at <b>${esc(p.dropLocation||"Not recorded")}</b> on ${fmt(p.deliveryTime)}. Photos from each upstream handoff remain visible below.</div><h3>Kitting Photo</h3>${photoHTML(p.kitPhotos)}<h3>Warehouse QC Photo</h3>${photoHTML(p.qcPhotos)}<h3>Production Drop Photo</h3>${photoHTML(p.deliveryPhotos)}<h3>Production Control Part Verification</h3>${partsTable(p,"PC")}<br><div class="toolbar"><button class="primary" onclick="verifyAll('${p.id}','pcVerified')">Demo: Scan / Verify All</button><button class="warning" onclick="makeShort('${p.id}','pcVerified')">Demo: Create Discrepancy</button><label>PC verification photo(s) <input type="file" accept="image/*" multiple onchange="addPhotos('${p.id}','pcPhotos',this)"></label></div>${photoHTML(p.pcPhotos)}<br><button class="success" onclick="completePC('${p.id}')">${p.pcComplete?"PC VERIFIED ✓":"Complete T-2 Production Control Verification"}</button>`}
function renderSchedule(){document.getElementById("schedulePage").innerHTML=`<div class="panel"><h2>T-3 / T-2 / T-1 Material Readiness Schedule</h2><div class="note"><b>Timing used in this application:</b> T-0 = Production Start. T-3 = required material delivery by 6:00 PM three days before production. T-2 = Production Control verification by 6:00 PM two days before. T-1 = shortage recovery/backpull by 6:00 PM one day before. Kitting target window starts 72–48 hours before the T-3 delivery deadline.</div><table><thead><tr><th>MOD</th><th>Subunit</th><th>Kitting Start (72h before T-3)</th><th>Latest Kitting Start (48h before T-3)</th><th>T-3 Delivery</th><th>T-2 PC Verification</th><th>T-1 Recovery</th><th>T-0 Production</th></tr></thead><tbody>${db.units.sort((a,b)=>new Date(a.productionStart)-new Date(b.productionStart)).map(u=>{let d=deadlines(u);return `<tr><td>${u.mod}</td><td><b>${u.subunit}</b></td><td>${fmt(d.kit72)}</td><td>${fmt(d.kit48)}</td><td>${fmt(d.t3)}</td><td>${fmt(d.t2)}</td><td>${fmt(d.t1)}</td><td>${fmt(d.t0)}</td></tr>`}).join("")}</tbody></table></div>`}
function centralShortages(){
 let rows=[];
 db.units.forEach(u=>u.pallets.forEach(p=>p.parts.forEach(x=>{
   let ks=kitShort(x),qs=shortage(x,"qcVerified"),ps=shortage(x,"pcVerified");
   if(ks>0)rows.push({u,p,x,type:"KITTING",expected:x.required,actual:x.kitted,qty:ks});
   if(p.releasedQC&&qs>0)rows.push({u,p,x,type:"WAREHOUSE QC",expected:x.kitted,actual:x.qcVerified||0,qty:qs});
   if(p.delivered&&ps>0)rows.push({u,p,x,type:"PRODUCTION CONTROL",expected:x.qcVerified||x.kitted,actual:x.pcVerified||0,qty:ps});
 })));
 return rows;
}
function renderShortageReport(){
 let rows=centralShortages();
 document.getElementById("shortagePage").innerHTML=`<div class="panel"><div class="toolbar"><h2 style="margin:0">Central Shortage Report</h2><div class="right"><span class="status red">${rows.length} OPEN SHORTAGE LINE(S)</span></div></div><div class="note">This report combines shortages and verification discrepancies from every MOD, subunit and pallet. Kitting shortages come from Required Qty vs Kitted Qty; QC and Production Control shortages come from their respective verification differences.</div><table><thead><tr><th>MOD</th><th>Subunit</th><th>Pallet</th><th>Operations</th><th>Shortage Stage</th><th>Part Number</th><th>Description</th><th>Expected Qty</th><th>Actual / Verified Qty</th><th>Shortage Qty</th><th>T-1 Recovery Deadline</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr class="lineShort"><td>${r.u.mod}</td><td><b>${r.u.subunit}</b></td><td>${r.p.pallet}</td><td>${r.p.operations}</td><td><span class="status red">${r.type}</span></td><td><b>${r.x.part}</b></td><td>${r.x.desc}</td><td>${r.expected}</td><td>${r.actual}</td><td><b>${r.qty}</b></td><td>${fmt(deadlines(r.u).t1)}</td><td><button class="primary" onclick="openShortageSource('${r.u.id}','${r.type}')">Open</button></td></tr>`).join("")||'<tr><td colspan="12"><span class="status green">NO OPEN SHORTAGES</span></td></tr>'}</tbody></table></div>`;
}
function openShortageSource(uid,type){page="plan";document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.id==="plan"));buildNav();renderPlan();renderDetailStage(uid,type==="KITTING"?"kitting":type==="WAREHOUSE QC"?"qc":"pc")}
function renderProcess(){document.getElementById("processPage").innerHTML=`<div class="panel"><h2>Operation-Based Pallet Material Flow</h2><div class="note">Pallets are created/assigned in SYSPRO. Each pallet moves independently through the process.</div><div class="process"><div class="stage"><b>1. SYSPRO Pallet / Operations</b><p>Pallet/bin + operation pick list</p></div><div class="arrow">→</div><div class="stage"><b>2. Warehouse Kitting</b><p>Pick parts and post transactions</p></div><div class="arrow">→</div><div class="stage"><b>3. Warehouse QC</b><p>Scan parts and verify quantity</p></div><div class="arrow">→</div><div class="stage"><b>4. T-3 Delivery</b><p>Photo + physical delivery</p></div><div class="arrow">→</div><div class="stage"><b>5. T-2 PC Verification</b><p>Verify received parts</p></div><div class="arrow">→</div><div class="stage"><b>6. T-1 Recovery</b><p>Backpull / close shortages</p></div><div class="arrow">→</div><div class="stage"><b>7. T-0 Production</b><p>Production start</p></div></div></div>`}
function getP(id){return allPallets().find(x=>x.p.id===id)}
function openNextInModal(pid,kind){let z=getP(pid);if(z)renderDetailStage(z.u.id,kind)}
function simulatePick(id){let {p}=getP(id),x=p.parts.find(x=>x.kitted<x.required);if(x)x.kitted=Math.min(x.required,x.kitted+5);p.sysproStatus=p.parts.every(x=>x.kitted>=x.required)?"POSTED / COMPLETE":"IN PROGRESS";save();openPallet(id,"kitting")}
function addPhotos(id,field,input,context){let z=getP(id),p=z.p,u=z.u,files=[...(input.files||[])].slice(0,6);files.forEach(f=>{let r=new FileReader();r.onload=()=>{p[field].push({name:f.name,data:r.result});localStorage.setItem(KEY,JSON.stringify(db));renderAll();if(context==="detail")openDetail(u.id);else openPallet(id,field==="kitPhotos"?"kitting":field==="qcPhotos"?"qc":field==="deliveryPhotos"?"delivery":"pc")};r.readAsDataURL(f)})}
function releaseQC(id,context){let z=getP(id),p=z.p,u=z.u;if(!p.kitPhotos.length)return alert("Upload a kitted pallet photo first.");p.releasedQC=true;save();if(context==="detail")openDetail(u.id);else if(detailId)renderDetailStage(u.id,"kitting");else openPallet(id,"kitting")}
function verifyAll(id,field){let {p}=getP(id);p.parts.forEach(x=>x[field]=field==="qcVerified"?x.kitted:(x.qcVerified||x.kitted));save();openPallet(id,field==="qcVerified"?"qc":"pc")}
function makeShort(id,field){let {p}=getP(id),x=p.parts[0],base=field==="qcVerified"?x.kitted:(x.qcVerified||x.kitted);x[field]=Math.max(0,base-1);save();openPallet(id,field==="qcVerified"?"qc":"pc")}
function readyDelivery(id){let {p}=getP(id);p.qcReady=true;save();openPallet(id,"qc")}
function confirmDelivery(id){let {p}=getP(id),loc=document.getElementById("drop").value.trim();if(!p.deliveryPhotos.length)return alert("Upload a delivery photo first.");if(!loc)return alert("Enter the pallet drop location.");p.dropLocation=loc;p.delivered=true;p.deliveryTime=new Date().toISOString();save();openPallet(id,"delivery")}
function completePC(id){let {p}=getP(id);p.pcComplete=true;p.pcTime=new Date().toISOString();save();openPallet(id,"pc")}
function updateUnit(id,f,v){let u=db.units.find(x=>x.id===id);u[f]=v;save();openDetail(id)}
function demoNewPallet(){let u=db.units.find(x=>x.mod==="A"),n=u.pallets.length+1,seq=String(n).padStart(3,"0");u.pallets.push({id:uid(),pallet:`PAL-A-${u.subunit}-${seq}`,bin:`BIN-A-${u.subunit}-${seq}`,operations:n===3?"6–8":String(n),sysproStatus:"STARTED",parts:[{id:uid(),part:"A-NEW-1001",desc:"Frame Component",required:16,kitted:0,qcVerified:0,pcVerified:0},{id:uid(),part:"A-NEW-1002",desc:"Hardware Set",required:8,kitted:0,qcVerified:0,pcVerified:0}],kitPhotos:[],releasedQC:false,qcPhotos:[],qcReady:false,deliveryPhotos:[],delivered:false,deliveryTime:"",dropLocation:"",pcPhotos:[],pcComplete:false,pcTime:""});save()}
function renderAll(){buildNav();if(document.getElementById("plan").classList.contains("active"))renderPlan();renderStagePages();renderSchedule();renderShortageReport();renderProcess()}
renderAll();
</script></body></html>
